spring:
  security:
    datawave:
      jwt:
        enabled: false
  # 1. CRITICAL GLOBAL OVERRIDE: Forces the template to wait for routing confirmation
  rabbitmq:
    # 1. Enables Publisher Confirms (Acks)
    publisher-confirm-type: correlated
    # 2. Ensures RabbitMQ returns unroutable messages rather than silently dropping them
    publisher-returns: true
    template:
      mandatory: true
  cloud:
    stream:
      # This ensures binder connection/channel errors bubble up to your application
      binding-retry-state-by-binder: true
      rabbit:
        bindings:
          persisted-out-0:
            producer:
              declareExchange: true
              # this forces inline errors
              error-channel-enabled: false
              # 4. Mandatory flag triggers the 'publisher-returns' when there is no queue bound
              confirm-ack-channel-enabled: true
              use-confirm-header: true
      bindings:
        persisted-out-0:
          destination: annotation
          content-type: application/x-protobuf
          # I think this doesn't belong here move to stream.rabbit.bindings
          producer:
            # 3. Ensures the producer fails if the message cannot be routed to a queue
            error-channel-enabled: false

hazelcast:
  server:
    k8s:
      service-dns-name: annotation-cache.{{ .Release.Namespace }}.svc.cluster.local
    # How long to wait (in seconds) before performing the first split-brain merge. When a number
    # of cache servers start up at once, they will form individual clusters because the attempt
    # to create a cluster happens before the server has registered in Consul. Therefore, the split
    # brain merge will take care of joining the multiple clusters.
    initialMergeDelaySeconds: 50
