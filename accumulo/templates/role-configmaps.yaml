{{- if and (eq $.Values.global.volumes.accumulo.source.type "configmap") $.Values.global.volumes.accumulo.source.create }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.global.volumes.accumulo.source.name }}-manager
  labels:
    {{- include "accumulo.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
data:
  accumulo.properties: |
    {{- include "accumulo.accumuloProperties" (dict "ctx" $ "overrides" $.Values.manager.accumuloSite) | nindent 4 }}

---

{{- range .Values.tabletServers.resourceGroups }}

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $.Values.global.volumes.accumulo.source.name }}-tserver-{{ .resourceGroupName }}
  labels:
    {{- include "accumulo.labels" $ | nindent 4 }}
    app.kubernetes.io/component: tserver-{{ .resourceGroupName }}
data:
  accumulo.properties: |
    {{- include "accumulo.accumuloProperties" (dict "ctx" $ "overrides" .accumuloSite) | nindent 4 }}
{{- end }}

