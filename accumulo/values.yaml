global:
  pullSecrets: 
  - dockerconfigjson-ghcr
  volumes:
    hadoop:
      name: hadoop
      destination: /usr/local/hadoop/conf
      readOnly: true
      source:
        type: configmap
        name: hadoop-config
    accumulo:
      name: accumulo
      destination: /opt/accumulo/conf
      readOnly: true
      source:
        type: configmap
        name: accumulo-config
        create: true
  accumulo:
    instanceName: dev
    zookeepers: zookeeper:2181
  hdfs:
    namenode: hdfs-nn:9000
logging:
  shellRootLevel: debug
  shellAccumuloLevel: trace
  serviceAccumuloLevel: debug
  serviceRootLevel: debug
nameOverride: ""
fullnameOverride: "accumulo"
labels: {}
hadoop:
  classpath:
    "/usr/local/hadoop/etc/hadoop:/usr/local/hadoop/lib/*:/usr/local/hadoop/.//*:/usr/local/hadoop-hdfs/./:/usr/local/hadoop-hdfs/lib/*:/usr/local/hadoop-hdfs/.//*:/usr/local/hadoop-mapreduce/.//*:/usr/local/hadoop-yarn/./:/usr/local/hadoop-yarn/lib/*:/usr/local/hadoop-yarn/.//*"
entrypointConfigMap: 
  name: accumulo-entrypoint
hostNetwork: {}
hdfs:
  volumes:
    - /accumulo
  namenode:
    hostname: "hdfs-nn"
    ports:
      clientRpc: 9000
  postInstallCommands:
    - hadoop fs -mkdir -p /accumulo
    - hadoop fs -chown accumulo /accumulo
    - hadoop fs -chmod 700 /accumulo
    - hadoop fs -ls /
zookeeper:
  externalHosts: "zookeeper"
config:
  auths: "JBOSS_ADMIN,DW_ADMIN,AUTH_USER,BAR,FOO,PRIVATE,PUBLIC"
  path: /opt/accumulo/conf
  files: {}
  accumuloSite:
    instance.secret: "DEFAULT"
    general.micrometer.enabled: true
  userManagement:
    rootPassword: "ThisP@ssw0rd1sBANANAS"
    # If accumulo.config.userManagement.revoke.enabled is:
    # true - Any users or permissions not specified below will be removed
    # false - Only missing users and permissions will be added
    revoke:
      enabled: false
    users:
      tracer:
        password: "tracer"
        permissions:
          system:
            - CREATE_TABLE
          table:
            trace:
              - READ
              - WRITE
  # Pins the accumulo.metadata table to the tservers in the "metadata"
  # resource group (tabletServers.resourceGroups) via Accumulo's
  # TableLoadBalancer (manager.tablet.balancer, the default balancer).
  postInstallCommands:
    - config -t accumulo.metadata -s table.custom.assignment.group=metadata
    - config -t accumulo.root -s table.custom.assignment.group=metadata
initContainer:
  image: ghcr.io/nationalsecurityagency/datawave-stack-hadoop
  tag: 3.4.1
image:
  repository: ghcr.io/nationalsecurityagency/datawave-stack-accumulo
  tag: 4.0.0-alpha
  
  pullPolicy: IfNotPresent
manager:
  resources: {}
  # The manager must land on a node dedicated to it. Label that node
  # accumulo.sh/node-pool=manager.
  nodeSelector:
    accumulo.sh/node-pool: manager
  tolerations: []
  affinity: {}
  accumuloSite: {}
tabletServers:
  resourceGroups:
  - resourceGroupName: default
    replicaCount: 3
    resources: {}
    # Each tablet server resource group must land on nodes dedicated to that
    # group. Label those nodes accumulo.sh/node-pool=<resourceGroupName>.
    nodeSelector:
      accumulo.sh/node-pool: default
    tolerations: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: "app.kubernetes.io/component"
              operator: In
              values:
              - tserver-default
          topologyKey: "kubernetes.io/hostname"
    accumuloSite:
      tserver.memory.maps.native.enabled: true
      tserver.memory.maps.max: 128M
      tserver.cache.data.size: 15M
      tserver.cache.index.size: 40M
      tserver.total.mutation.queue.max: 16M
      tserver.sort.buffer.size: 50M
      tserver.walog.max.size: 128M
  # Dedicated group for hosting the accumulo.metadata table, kept off the
  # nodes serving user tablets. Pinning the table itself to this group is
  # done via config.postInstallCommands (table.custom.assignment.group).
  - resourceGroupName: metadata
    replicaCount: 2
    resources: {}
    nodeSelector:
      accumulo.sh/node-pool: metadata
    tolerations: []
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
            - key: "app.kubernetes.io/component"
              operator: In
              values:
              - tserver-metadata
          topologyKey: "kubernetes.io/hostname"
    accumuloSite:
      tserver.memory.maps.native.enabled: true
      tserver.memory.maps.max: 128M
      tserver.cache.data.size: 15M
      tserver.cache.index.size: 40M
      tserver.total.mutation.queue.max: 16M
      tserver.sort.buffer.size: 50M
      tserver.walog.max.size: 128M
compactors:
  # Compactors can run on any node provisioned for Accumulo workloads. Label
  # those nodes accumulo.sh/node-pool=accumulo.
  resourceGroups:
  - resourceGroupName: default
    serviceName: defaultCompactionService
    jsonConfig: "[{\"group\":\"default\"}]"
    plannerClass: org.apache.accumulo.core.spi.compaction.RatioBasedCompactionPlanner
    resources: {}
    nodeSelector:
      accumulo.sh/node-pool: accumulo
    tolerations: []
    affinity: {}
    accumuloSite: {}
  - resourceGroupName: test
    serviceName: testCompactionService
    jsonConfig: "[{\"group\":\"test\"}]"
    plannerClass: org.apache.accumulo.core.spi.compaction.RatioBasedCompactionPlanner
    resources: {}
    nodeSelector:
      accumulo.sh/node-pool: accumulo
    tolerations: []
    affinity: {}
    accumuloSite: {}
scanServers:
  # Scan servers can run on any node provisioned for Accumulo workloads.
  # Label those nodes accumulo.sh/node-pool=accumulo.
  resourceGroups:
  - resourceGroupName: group1
    replicaCount: 1
    resources: {}
    nodeSelector:
      accumulo.sh/node-pool: accumulo
    tolerations: []
    affinity: {}
    accumuloSite: {}
  - resourceGroupName: default
    replicaCount: 1
    resources: {}
    nodeSelector:
      accumulo.sh/node-pool: accumulo
    tolerations: []
    affinity: {}
    accumuloSite: {}
gc:
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  accumuloSite: {}
cmds:
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  accumuloSite: {}
monitor:
  replicaCount: 1
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  accumuloSite: {}
  ingress:
    enabled: true
    annotations: []
    host: "accumulo.datawave.org"
    # For Traefik:
    #pathPrefix: /accumulo/
    # For Nginx:
